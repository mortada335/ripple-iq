version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rippleiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rippleiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rippleiq_password}
      POSTGRES_DB: ${POSTGRES_DB:-rippleiq_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rippleiq_user} -d ${POSTGRES_DB:-rippleiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rippleiq_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rippleiq_user}:${POSTGRES_PASSWORD:-rippleiq_password}@db:5432/${POSTGRES_DB:-rippleiq_db}
      - ENVIRONMENT=production
      - DEBUG=False
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
